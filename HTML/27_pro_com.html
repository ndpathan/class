<html>
    <head>
        <title>email compose</title>
    </head>
    <body>
        <form action="success.html">
            <table align="center" width="50%" border="1" cellpadding="10" >
            <tr>
                <th bgcolor="yellow">Compose Email</th>
            </tr>
            <tr>
                <th bgcolor="#87CEEB">Email:</th>
            </tr><tr>
                <th><input type="text" name="email"></th>
            </tr>
            <tr>
                <th bgcolor="#98FF98">Subject</th>
            </tr>
            </tr><tr>
                <th><input type="text" name="email"></th>
            </tr>
            <tr>
                <th bgcolor="#DC143C">Attachment</th>
            </tr>
            </tr><tr>
                <th><input type="file" name="email"></th>
            </tr>
             <tr>
                <th bgcolor="#F4C2C2">Address</th>
            </tr>
            <tr>
                 <td>
                        <textarea name="address" rows="5" cols="30" id="address"></textarea>
                    </td>
            </tr>
            <tr>
                <td bgcolor="#FF4500" align="center">
                    <button type="submit">send email</button>
                    <button type="reset">clear all</button>
                </td>
            </tr>
            </table>
    </body>
</html>
