
<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <style>
        body {
            background-color: lightyellow;
            font-family: Arial;
            margin: 30px;
        }

        h1 {
            color: blue;
            font-size: 40px;
            text-align: center;
            padding: 15px;
        }

        p {
            color: darkgreen;
            font-size: 20px;
            font-family: Georgia;
            background-color: lightblue;
            padding: 20px;
            margin: 25px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            margin: 20px;
            border: none;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Web Page</h1>

    <p>
        HTML is used to create web pages.
        CSS is used to make web pages beautiful
        by adding colors, fonts and styles.
    </p>

    <button>Click Me</button>

</body>
</html>
