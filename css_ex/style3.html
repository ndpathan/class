
<!DOCTYPE html>
<html>
<head>
    <title>CSS Buttons</title>

    <style>
        body {
            text-align: center;
            background-color: lightyellow;
            font-family: Arial;
        }

        h1 {
            color: darkblue;
            margin-top: 50px;
        }

        button {
            padding: 15px 30px;
            margin: 15px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.5s;
        }

        .btn1 {
            background: linear-gradient(red, orange);
        }

        .btn2 {
            background: linear-gradient(blue, purple);
        }

        .btn3 {
            background: linear-gradient(green, lightgreen);
        }

        .btn4 {
            background: linear-gradient(pink, deeppink);
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 3px 3px 10px gray;
        }
    </style>
</head>

<body>

    <h1>Different CSS Buttons</h1>

    <button class="btn1">Button 1</button>

    <button class="btn2">Button 2</button>

    <button class="btn3">Button 3</button>

    <button class="btn4">Button 4</button>

</body>
</html>
