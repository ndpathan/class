<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paragraph tag</title>
</head>
<body>

    <p>
        This is the first sentence of paragraph one.<br>
        This sentence appears on a new line inside the same first paragraph.
    </p>

    <p>
        This is the first sentence of paragraph two.<br>
        This sentence appears on a new line inside the same second paragraph.
    </p>

</body>
</html>
