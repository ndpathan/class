<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>

    <h2>Reset Password</h2>

    <form>
        <label for="email">Enter your registered Email:</label><br><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="new-pass">Enter New Password:</label><br><br>
        <input type="password" id="new-pass" name="new-pass"><br><br>

        <label for="confirm-pass">Confirm New Password:</label><br><br>
        <input type="password" id="confirm-pass" name="confirm-pass"><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
